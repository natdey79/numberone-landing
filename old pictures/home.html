<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Number One</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="style.css">
    
    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api" defer></script>
    
    <style>
        /* --- FLOATING LANGUAGE ICONS (TOP LEFT, SIDE BY SIDE, ALIGNED WITH HOME) --- */
        .floating-lang-flags {
            position: fixed;
            top: 15px;
            left: 115px;
            z-index: 9999;
            display: flex;
            flex-direction: row;
            gap: 8px;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
        }

        .floating-lang-btn {
            display: block;
            text-decoration: none;
            padding: 4px;
            border-radius: 12px;
            transition: all 0.25s ease;
            cursor: pointer;
            border: 2px solid transparent;
            background: rgba(17, 17, 17, 0.5);
        }

        .floating-lang-btn:hover {
            background: #252525;
            border-color: #FFD700;
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
        }

        .floating-flag-img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            transition: transform 0.25s ease;
        }

        .floating-lang-btn:hover .floating-flag-img {
            transform: scale(1.05);
        }

        /* Hide floating flags on mobile */
        @media (max-width: 1100px) {
            .floating-lang-flags {
                display: none !important;
            }
        }

        /* Adjust side panel to remove language section */
        .side-lang-flags {
            display: none !important;
        }
        .side-menu-separator {
            display: none !important;
        }

        /* YouTube Video Wrapper */
        .youtube-video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #000;
        }

        .youtube-video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        /* Mobile YouTube */
        @media (max-width: 1100px) {
            .youtube-video-wrapper {
                border-radius: 8px !important;
                margin-bottom: 0 !important;
            }
            .youtube-video-wrapper iframe {
                border-radius: 8px !important;
            }
        }
    </style>
</head>
<body>

    <!-- MOBILE HAMBURGER BUTTON -->
    <div id="mobile-menu-toggle" class="mobile-menu-toggle" onclick="toggleMobileMenu()">
        <i class="fas fa-bars"></i>
    </div>

    <!-- MOBILE OVERLAY -->
    <div id="mobile-overlay" class="mobile-overlay" onclick="toggleMobileMenu()"></div>

    <!-- === FLOATING LANGUAGE ICONS (ALIGNED WITH HOME BUTTON) === -->
    <div class="floating-lang-flags">
        <a href="#" onclick="setLanguage('en'); return false;" class="floating-lang-btn" title="Switch to English">
            <img src="flag-en.webp" alt="EN" class="floating-flag-img">
        </a>
        <a href="#" onclick="setLanguage('zh'); return false;" class="floating-lang-btn" title="Switch to Chinese">
            <img src="flag-zh.webp" alt="中文" class="floating-flag-img">
        </a>
        <a href="#" onclick="setLanguage('ms'); return false;" class="floating-lang-btn" title="Switch to Malay">
            <img src="flag-ms.webp" alt="MS" class="floating-flag-img">
        </a>
    </div>

    <!-- SIDE PANEL (CLEANED UP - NO LANGUAGE SECTION) -->
    <div class="side-panel" id="sidePanel">
        
        <!-- Home -->
        <a href="#" onclick="showSection('section-home'); return false;" class="side-icon" title="Home">
            <i class="fas fa-home"></i>
            <span class="side-label" data-i18n="nav_home">Home</span>
        </a>
        
        <!-- Product -->
        <a href="#" onclick="showSection('section-product'); return false;" class="side-icon" title="Product">
            <i class="fas fa-box"></i>
            <span class="side-label" data-i18n="nav_product">Product</span>
        </a>
        
        <!-- Reviews -->
        <a href="#" onclick="showSection('section-review'); return false;" class="side-icon" title="Reviews">
            <i class="fas fa-star"></i>
            <span class="side-label" data-i18n="nav_review">Reviews</span>
        </a>
        
        <!-- Contact Dropdown -->
        <div class="side-dropdown-wrapper">
            <a href="#" onclick="return false;" class="side-icon side-dropdown-toggle" title="Contact">
                <i class="fas fa-envelope"></i>
                <span class="side-label" data-i18n="nav_contact">Contact</span>
            </a>
            <div class="side-dropdown-content">
                <a href="https://wa.me/601137424783" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            </div>
        </div>

        <!-- About Us Dropdown -->
        <div class="side-dropdown-wrapper">
            <a href="#" onclick="return false;" class="side-icon side-dropdown-toggle" title="About Us">
                <i class="fas fa-info-circle"></i>
                <span class="side-label" data-i18n="nav_about">About Us</span>
            </a>
            <div class="side-dropdown-content">
                <a href="https://www.facebook.com/share/1EULLxnS5W/" target="_blank"><i class="fab fa-facebook-f"></i> Facebook</a>
                <a href="https://www.instagram.com/numberone.my" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
                <a href="https://www.tiktok.com/@numberone.my" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a>
            </div>
        </div>

    </div>

    <!-- MAIN CONTENT AREA -->
    <div class="main-content-area">
        <!-- HEADER - HIDDEN ON DESKTOP, VISIBLE ON MOBILE -->
        <header class="site-header">
            <!-- LEFT GROUP: Hamburger + Language Flags -->
            <div class="header-left-group">
                <div class="header-hamburger" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="mobile-lang-flags">
                    <span class="mobile-lang-flag" data-lang="en" onclick="setLanguage('en')">🇬🇧</span>
                    <span class="mobile-lang-flag" data-lang="zh" onclick="setLanguage('zh')">🇨🇳</span>
                    <span class="mobile-lang-flag" data-lang="ms" onclick="setLanguage('ms')">🇲🇾</span>
                </div>
            </div>

            <!-- RIGHT: Logo -->
            <img src="logo.webp" alt="Number One Logo" class="top-right-logo" loading="lazy">
        </header>

        <!-- SECTION: HOME -->
        <div id="section-home" class="page-section">
            <!-- SPLIT POSTER - DESKTOP ONLY (1:5:1 RATIO) -->
            <section class="product-poster-split">
                <!-- Left Part (1 part) -->
                <div class="poster-left">
                    <img src="en_poster-logo.webp" class="poster-img poster-left-img lang-poster" data-base="poster-logo.webp" alt="Number One Logo" loading="lazy">
                </div>
                <!-- Middle Part (5 parts) -->
                <div class="poster-middle">
                    <img src="en_background-box.webp" class="poster-img poster-middle-img lang-poster" data-base="background-box.webp" alt="Number One Background" loading="lazy">
                </div>
                <!-- Right Part (1 part) -->
                <div class="poster-right">
                    <img src="en_poster-logo.webp" class="poster-img poster-right-img lang-poster" data-base="poster-logo.webp" alt="Number One Logo" loading="lazy">
                </div>
            </section>

            <!-- ORIGINAL POSTER FOR MOBILE (hidden on desktop) -->
            <section class="product-poster-mobile" data-bg="background-box" data-bg-mobile="background-box-mobile">
                <!-- Pure CSS Background for mobile -->
            </section>

            <!-- GALLERY WITH YOUTUBE VIDEO -->
            <section class="product-main-section">
                <div class="gallery-wrapper-80">
                    <div class="product-image-gallery">
                        <!-- YOUTUBE VIDEO - FIRST ITEM -->
                        <div class="youtube-video-wrapper fiery-border">
                            <div id="youtube-player"></div>
                        </div>
                        
                        <!-- EXISTING IMAGES -->
                        <img src="en_pic1.webp" class="lang-img fiery-border" data-base="pic1.webp" loading="lazy">
                        <img src="en_pic2.webp" class="lang-img fiery-border" data-base="pic2.webp" loading="lazy">
                        <img src="en_pic3.webp" class="lang-img fiery-border" data-base="pic3.webp" loading="lazy">
                        <img src="en_pic4.webp" class="lang-img fiery-border" data-base="pic4.webp" loading="lazy">
                    </div>
                </div>
            </section>
        </div>

        <!-- SECTION: PRODUCT -->
        <div id="section-product" class="page-section" style="display:none;">
            <!-- SPLIT POSTER - DESKTOP ONLY (1:5:1 RATIO) -->
            <section class="product-poster-split">
                <!-- Left Part (1 part) -->
                <div class="poster-left">
                    <img src="en_poster-logo.webp" class="poster-img poster-left-img lang-poster" data-base="poster-logo.webp" alt="Number One Logo" loading="lazy">
                </div>
                <!-- Middle Part (5 parts) -->
                <div class="poster-middle">
                    <img src="en_background-box.webp" class="poster-img poster-middle-img lang-poster" data-base="background-box.webp" alt="Number One Background" loading="lazy">
                </div>
                <!-- Right Part (1 part) -->
                <div class="poster-right">
                    <img src="en_poster-logo.webp" class="poster-img poster-right-img lang-poster" data-base="poster-logo.webp" alt="Number One Logo" loading="lazy">
                </div>
            </section>

            <!-- ORIGINAL POSTER FOR MOBILE (hidden on desktop) -->
            <section class="product-poster-mobile" data-bg="background-box" data-bg-mobile="background-box-mobile">
                <!-- Pure CSS Background for mobile -->
            </section>
            
            <section class="product-main-section">
                <div class="product-info-sidebar" style="flex: 1; width: 100%; max-width: 800px; margin: 0 auto;">
                    <div class="gallery-wrapper-80">
                        <div class="ingredient-image-container">
                            <img src="en_ingredient.webp" class="lang-ingredient-img fiery-border" data-base="ingredient.webp" alt="Product Ingredients" loading="lazy">
                        </div>

                        <div class="ingredient-image-container" style="margin-top: 25px;">
                            <img src="en_ingredient-2.webp" class="lang-ingredient-img fiery-border" data-base="ingredient-2.webp" alt="Product Ingredients 2" loading="lazy">
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- SECTION: REVIEW -->
        <div id="section-review" class="page-section" style="display:none;">
            <!-- SPLIT POSTER - DESKTOP ONLY (1:5:1 RATIO) -->
            <section class="product-poster-split">
                <!-- Left Part (1 part) -->
                <div class="poster-left">
                    <img src="en_poster-logo.webp" class="poster-img poster-left-img lang-poster" data-base="poster-logo.webp" alt="Number One Logo" loading="lazy">
                </div>
                <!-- Middle Part (5 parts) -->
                <div class="poster-middle">
                    <img src="en_background-box.webp" class="poster-img poster-middle-img lang-poster" data-base="background-box.webp" alt="Number One Background" loading="lazy">
                </div>
                <!-- Right Part (1 part) -->
                <div class="poster-right">
                    <img src="en_poster-logo.webp" class="poster-img poster-right-img lang-poster" data-base="poster-logo.webp" alt="Number One Logo" loading="lazy">
                </div>
            </section>

            <!-- ORIGINAL POSTER FOR MOBILE (hidden on desktop) -->
            <section class="product-poster-mobile" data-bg="background-box" data-bg-mobile="background-box-mobile">
                <!-- Pure CSS Background for mobile -->
            </section>
            
            <section class="testimonials-section">
                
                <!-- CHAT BOX STYLE TESTIMONIALS -->
                <div class="chat-container">
                    <div class="chat-header-bar">
                        <div class="chat-header-left">
                            <span class="chat-dot online"></span>
                            <span class="chat-header-title">Live Feed</span>
                        </div>
                        <div class="chat-header-right">
                            <span class="chat-status">🟢 Live</span>
                        </div>
                    </div>
                    
                    <div class="chat-messages" id="testimonial-chat-container">
                        <!-- Messages will be inserted here -->
                        <div class="loading-message" style="text-align:center; color:#666; padding:40px 0;">
                            <i class="fas fa-spinner fa-spin" style="font-size:24px;"></i>
                            <p style="margin-top:10px;">Loading testimonials...</p>
                        </div>
                    </div>
                    
                    <div class="chat-footer-bar">
                        <button class="share-experience-btn" onclick="openTestimonialForm()">
                            <i class="fas fa-pen"></i> <span data-i18n="share_experience">Share Your Experience</span>
                        </button>
                    </div>
                </div>
                
            </section>
        </div>

    </div> <!-- End main-content-area -->

    <!-- LIGHTBOX OVERLAY -->
    <div id="lightbox-overlay" class="lightbox-overlay" onclick="closeLightbox()">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img class="lightbox-content" id="lightbox-image" src="" loading="lazy">
    </div>

    <!-- WHATSAPP ORDER MODAL -->
    <div id="order-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 data-i18n="modal_title">Order Information</h2>
            <div class="form-group">
                <label for="cust-name" data-i18n="modal_name">Name</label>
                <input type="text" id="cust-name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="cust-phone" data-i18n="modal_phone">Phone Number</label>
                <input type="text" id="cust-phone" placeholder="e.g. 0123456789">
            </div>
            <div class="form-group">
                <label for="cust-address" data-i18n="modal_address">Delivery Address</label>
                <textarea id="cust-address" placeholder="Enter your full delivery address"></textarea>
            </div>
            <label style="display:block; font-weight:600; font-size:14px; margin-bottom:5px; color:#e8e8e8;" data-i18n="modal_flavor">Select Flavors & Quantities</label>
            <div class="flavor-group">
                <div class="form-group">
                    <label style="font-weight:400; font-size:13px; color:#d2d2d2;">Original</label>
                    <select id="cust-qty-original" onchange="updateTotalPrice()">
                        <option value="0">0</option><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="font-weight:400; font-size:13px; color:#d2d2d2;">Chocolate</label>
                    <select id="cust-qty-chocolate" onchange="updateTotalPrice()">
                        <option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
                    </select>
                </div>
            </div>
            <div class="total-qty-display"><span data-i18n="modal_qty">Total Quantity:</span> <span id="total-qty">1</span></div>
            <div class="total-price-display"><span data-i18n="modal_total">Total:</span> RM<span id="total-price">168.00</span></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeOrderModal()" data-i18n="modal_cancel">Cancel</button>
                <button class="btn-submit" onclick="submitOrderToWhatsApp()" data-i18n="modal_submit">Submit</button>
            </div>
        </div>
    </div>

    <!-- SUBMIT TESTIMONIAL MODAL -->
    <div id="testimonial-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>📝 <span data-i18n="share_experience">Share Your Experience</span></h2>
            <p style="color: #aaa; font-size: 14px; text-align: center; margin-bottom: 20px;" data-i18n="review_will_be_reviewed">
                Your review will be reviewed before going live.
            </p>
            <form id="testimonial-form" onsubmit="submitTestimonial(event)">
                <div class="form-group">
                    <label data-i18n="modal_name">Your Name</label>
                    <input type="text" id="testimonial-name" placeholder="e.g., John D." data-i18n-placeholder="name_placeholder" required>
                </div>
                <div class="form-group">
                    <label data-i18n="modal_title">Title</label>
                    <input type="text" id="testimonial-title" placeholder="e.g., Life-Changing!" data-i18n-placeholder="title_placeholder" required>
                </div>
                <div class="form-group">
                    <label data-i18n="modal_comment">Your Review</label>
                    <textarea id="testimonial-comment" rows="4" placeholder="Share your experience..." data-i18n-placeholder="review_placeholder" required></textarea>
                </div>
                <div class="form-group">
                    <label data-i18n="modal_rating">Rating</label>
                    <select id="testimonial-rating" required>
                        <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                        <option value="4">⭐⭐⭐⭐ (4)</option>
                        <option value="3">⭐⭐⭐ (3)</option>
                        <option value="2">⭐⭐ (2)</option>
                        <option value="1">⭐ (1)</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeTestimonialForm()" data-i18n="modal_cancel">Cancel</button>
                    <button type="submit" class="btn-submit" data-i18n="submit_review">Submit Review</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FLOATING CART BUTTON -->
    <a href="javascript:void(0);" onclick="openOrderModal()" class="floating-cart-btn" id="floatingCartBtn">
        <i class="fas fa-shopping-cart"></i>
    </a>

    <script src="script.js" defer></script>
</body>
</html>
