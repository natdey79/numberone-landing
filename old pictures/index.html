<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Number One</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; background: #000; }
        
        .landing-shell { position: relative; width: 100%; min-height: 100vh; }
        .splash-container { position: relative; width: 100%; height: 100vh; display: flex; justify-content: center; align-items: flex-start; overflow: hidden; background: #000; }

        /* --- VIDEO BACKGROUND --- */
        .splash-video { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; width: 100%; height: 100%; transform: translateX(-50%) translateY(-50%); object-fit: cover; z-index: 0; filter: brightness(0.65) contrast(1.1); display: block; }
        .splash-video.desktop-video { display: block; }
        .splash-video.mobile-video { display: none; }

        /* --- CONTENT --- */
        .splash-content { position: relative; z-index: 3; padding-top: 20px; max-width: 800px; width: 100%; text-align: center; opacity: 0; animation: fadeInUp 1s ease-out forwards 0.5s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .splash-logo-title { max-width: 80%; width: 600px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.6)) drop-shadow(0 0 40px rgba(255, 140, 0, 0.4)) drop-shadow(0 0 80px rgba(255, 215, 0, 0.2)) drop-shadow(0 0 120px rgba(255, 69, 0, 0.15)); animation: fieryPulse 2.5s ease-in-out infinite; transition: filter 0.3s ease; }
        .splash-logo-title.desktop-logo { display: block; }
        .splash-logo-title.mobile-logo { display: none; }
        
        @keyframes fieryPulse {
            0% { filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.5)) drop-shadow(0 0 40px rgba(255, 140, 0, 0.3)) drop-shadow(0 0 80px rgba(255, 215, 0, 0.15)) drop-shadow(0 0 120px rgba(255, 69, 0, 0.1)); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 69, 0, 0.9)) drop-shadow(0 0 60px rgba(255, 140, 0, 0.6)) drop-shadow(0 0 100px rgba(255, 215, 0, 0.3)) drop-shadow(0 0 160px rgba(255, 69, 0, 0.2)); }
            100% { filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.5)) drop-shadow(0 0 40px rgba(255, 140, 0, 0.3)) drop-shadow(0 0 80px rgba(255, 215, 0, 0.15)) drop-shadow(0 0 120px rgba(255, 69, 0, 0.1)); }
        }
        .splash-logo-title:hover { filter: drop-shadow(0 0 40px rgba(255, 69, 0, 1)) drop-shadow(0 0 80px rgba(255, 140, 0, 0.8)) drop-shadow(0 0 140px rgba(255, 215, 0, 0.4)) drop-shadow(0 0 200px rgba(255, 69, 0, 0.3)); transform: scale(1.02); transition: all 0.4s ease; }

        /* --- CTA BUTTON --- */
        .cta-wrapper { position: absolute; bottom: 100px; left: 0; right: 0; z-index: 3; display: flex; justify-content: center; opacity: 0; animation: fadeInUp 1s ease-out forwards 1s; }
        .cta-btn { display: inline-block; padding: 24px 60px; background: #dc143c; color: #fff; font-size: 26px; font-weight: 700; border: 3px solid #dc143c; border-radius: 50px; cursor: pointer; text-decoration: none; text-transform: uppercase; letter-spacing: 3px; animation: pulseSway 2.5s infinite ease-in-out; box-shadow: 0 0 30px rgba(220, 20, 60, 0.4); }
        .cta-btn:hover { background: transparent; color: #dc143c; animation-play-state: paused; box-shadow: 0 0 50px rgba(220, 20, 60, 0.6); }
        .cta-btn i { margin-right: 12px; font-size: 28px; }
        @keyframes pulseSway {
            0% { transform: translateX(0px) scale(1); box-shadow: 0 0 30px rgba(220, 20, 60, 0.4); }
            25% { transform: translateX(-6px) scale(1.03); box-shadow: 0 0 50px rgba(220, 20, 60, 0.7); }
            50% { transform: translateX(6px) scale(1); box-shadow: 0 0 30px rgba(220, 20, 60, 0.4); }
            75% { transform: translateX(-6px) scale(1.03); box-shadow: 0 0 50px rgba(220, 20, 60, 0.7); }
            100% { transform: translateX(0px) scale(1); box-shadow: 0 0 30px rgba(220, 20, 60, 0.4); }
        }

        /* --- MOBILE OVERRIDES --- */
        @media (max-width: 768px) {
            .splash-content { padding-top: 40px; }
            .splash-logo-title.desktop-logo { display: none; }
            .splash-logo-title.mobile-logo { display: block; max-width: 85%; width: 300px; }
            .cta-wrapper { bottom: 80px !important; }
            .cta-btn { padding: 18px 40px; font-size: 20px; letter-spacing: 2px; animation-duration: 2s; border-width: 2px; }
            .cta-btn i { font-size: 22px; }
            .splash-video.desktop-video { display: none; }
            .splash-video.mobile-video { display: block; }
        }
        
        @media (max-width: 480px) {
            .splash-logo-title.mobile-logo { max-width: 90%; width: 220px; }
            .cta-btn { padding: 14px 30px; font-size: 17px; }
            .cta-btn i { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="landing-shell">
        <div class="splash-container">
            
            <!-- DESKTOP VIDEO -->
            <video autoplay muted loop playsinline class="splash-video desktop-video" preload="metadata">
                <source src="intro-index.webm" type="video/webm">
            </video>

            <!-- MOBILE VIDEO (Optimized with preload="metadata") -->
            <video autoplay muted loop playsinline class="splash-video mobile-video" preload="metadata">
                <source src="intro-index-mobile.webm" type="video/webm">
            </video>

            <!-- TOP IMAGES -->
            <div class="splash-content">
                <img src="unleash-desktop.webp" alt="" class="splash-logo-title desktop-logo" loading="lazy">
                <img src="unleash.webp" alt="" class="splash-logo-title mobile-logo" loading="lazy">
            </div>

            <!-- CTA BUTTON -->
            <div class="cta-wrapper">
                <a href="home.html" class="cta-btn">
                    <i class="fas fa-bolt"></i> Get Tough
                </a>
            </div>
        </div>
    </div>
</body>
</html>
