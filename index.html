<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Number One</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- RESET & BASICS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevents scrolling on the splash screen */
            background-color: #000;
        }

        /* --- SPLASH SCREEN CONTAINER --- */
        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* --- BACKGROUND VIDEO --- */
        .splash-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
            z-index: 1;
            /* Adds slight contrast to make text readable */
            filter: brightness(0.6) contrast(1.1); 
        }

        /* --- OVERLAY GRADIENT --- */
        .splash-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 2;
        }

        /* --- CONTENT LAYER --- */
        .splash-content {
            position: relative;
            z-index: 3;
            padding: 20px;
            max-width: 800px;
            opacity: 0;
            /* Fade-in animation for text */
            animation: fadeInUp 1s ease-out forwards 0.5s; 
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- TYPOGRAPHY --- */
        .splash-content h1 {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3), 0 4px 15px rgba(0,0,0,0.5);
            text-transform: uppercase;
        }

        .splash-content p {
            font-size: 22px;
            font-weight: 300;
            color: #ddd;
            margin-bottom: 50px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        /* --- THE "GET TOUGH" BUTTON (WITH SWAY ANIMATION) --- */
        .cta-btn {
            display: inline-block;
            padding: 18px 45px;
            background-color: #dc143c; /* High energy Crimson Red */
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            border: 2px solid #dc143c;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            
            /* Continuous Sway & Burn Animation */
            animation: pulseSway 2.5s infinite ease-in-out;
        }

        .cta-btn:hover {
            background-color: transparent;
            color: #dc143c;
            animation-play-state: paused; /* Stops the sway when hovering */
        }

        .cta-btn i {
            margin-right: 10px;
        }

        /* --- ANIMATION KEYFRAMES --- */
        @keyframes pulseSway {
            0% {
                transform: translateX(0px) scale(1);
                box-shadow: 0 0 20px rgba(220, 20, 60, 0.3);
            }
            25% {
                transform: translateX(-5px) scale(1.02);
                box-shadow: 0 0 35px rgba(220, 20, 60, 0.6);
            }
            50% {
                transform: translateX(5px) scale(1);
                box-shadow: 0 0 20px rgba(220, 20, 60, 0.3);
            }
            75% {
                transform: translateX(-5px) scale(1.02);
                box-shadow: 0 0 35px rgba(220, 20, 60, 0.6);
            }
            100% {
                transform: translateX(0px) scale(1);
                box-shadow: 0 0 20px rgba(220, 20, 60, 0.3);
            }
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .splash-content h1 {
                font-size: 36px;
                letter-spacing: 2px;
            }
            .splash-content p {
                font-size: 16px;
                margin-bottom: 30px;
            }
            .cta-btn {
                padding: 14px 30px;
                font-size: 16px;
                animation-duration: 2s; /* Slightly faster animation on smaller screens */
            }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        
        <!-- BACKGROUND VIDEO -->
        <video autoplay muted loop playsinline class="splash-video">
            <!-- Replace this src with your own video file like 'animation.mp4' -->
            <source src="intro-index.mp4" type="video/mp4">
            <!-- Fallback image if video fails to load -->
            <img src="poster.jpg?q=80&w=2070&auto=format&fit=crop" alt="Background">
        </video>

        <!-- DARK OVERLAY -->
        <div class="splash-overlay"></div>

        <!-- TEXT CONTENT -->
        <div class="splash-content">
            <h1>Welcome</h1>
            <p>Unleash Your Potential</p>
            
            <!-- ANIMATED BUTTON -->
            <a href="product.html" class="cta-btn">
                <i class="fas fa-bolt"></i> Get Tough
            </a>
        </div>
    </div>

</body>
</html>
