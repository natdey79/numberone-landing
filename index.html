<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Number One</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        .landing-shell {
            position: relative;
            width: 100%;
            min-height: 100vh;
        }

        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Pushes text to the TOP */
            overflow: hidden;
            background: #000;
        }

        .splash-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: 100%;
            height: 100%;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.65) contrast(1.1);
            display: block;
        }

        /* --- TOP TEXT --- */
        .splash-content {
            position: relative;
            z-index: 3;
            padding-top: 80px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards 0.5s;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- FIERY WELCOME TEXT --- */
        .splash-content h1 {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-transform: none;
            
            /* --- FIRE GRADIENT & GLOW --- */
            background: linear-gradient(to right, #ff4500, #ff8c00, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Outer glowing fire effect */
            text-shadow: 0 0 20px rgba(255, 69, 0, 0.8), 
                         0 0 40px rgba(255, 140, 0, 0.6),
                         0 0 60px rgba(255, 215, 0, 0.4);
            
            /* Fallback for older browsers */
            color: #ff4500;
        }

        .splash-content p {
            font-size: 22px;
            font-weight: 300;
            color: #ddd;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        /* --- BUTTON (Locked at Bottom) --- */
        .cta-wrapper {
            position: absolute;
            bottom: 100px; /* Locks it exactly 30px from the bottom */
            left: 0;
            right: 0;
            z-index: 3;
            display: flex;
            justify-content: center;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards 1s;
        }

        /* On mobile, push it up a bit more to avoid the browser bar */
        @media (max-width: 768px) {
            .cta-wrapper {
                bottom: 100px !important; 
            }
        }

        .cta-btn {
            display: inline-block;
            padding: 18px 45px;
            background-color: #dc143c;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            border: 2px solid #dc143c;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulseSway 2.5s infinite ease-in-out;
        }

        .cta-btn:hover {
            background-color: transparent;
            color: #dc143c;
            animation-play-state: paused;
        }

        .cta-btn i {
            margin-right: 10px;
        }

        @keyframes pulseSway {
            0% { transform: translateX(0px) scale(1); box-shadow: 0 0 20px rgba(220, 20, 60, 0.3); }
            25% { transform: translateX(-5px) scale(1.02); box-shadow: 0 0 35px rgba(220, 20, 60, 0.6); }
            50% { transform: translateX(5px) scale(1); box-shadow: 0 0 20px rgba(220, 20, 60, 0.3); }
            75% { transform: translateX(-5px) scale(1.02); box-shadow: 0 0 35px rgba(220, 20, 60, 0.6); }
            100% { transform: translateX(0px) scale(1); box-shadow: 0 0 20px rgba(220, 20, 60, 0.3); }
        }

        /* --- DESKTOP VIDEO --- */
        .splash-video.desktop-video { display: block; }
        .splash-video.mobile-video { display: none; }

        /* --- MOBILE VIDEO & SCALING --- */
        @media (max-width: 768px) {
            .splash-content {
                padding-top: 40px;
            }
            .splash-content h1 {
                font-size: 36px;
                letter-spacing: 2px;
            }
            .splash-content p {
                font-size: 16px;
            }
            .cta-btn {
                padding: 14px 30px;
                font-size: 16px;
                animation-duration: 2s;
            }
            .splash-logo { font-size: 32px; }
            .splash-timer { font-size: 32px; }

            /* Switch videos */
            .splash-video.desktop-video { display: none; }
            .splash-video.mobile-video { display: block; }
        }
    </style>
</head>
<body>
    <div class="landing-shell">
        <div class="splash-container">
            
            <!-- DESKTOP VIDEO -->
            <video autoplay muted loop playsinline class="splash-video desktop-video">
                <source src="intro-index.mp4" type="video/mp4">
                <img src="poster.jpg?q=80&w=2070&auto=format&fit=crop" alt="Desktop Fallback">
            </video>

            <!-- MOBILE VIDEO -->
            <video autoplay muted loop playsinline class="splash-video mobile-video">
                <source src="intro-index-mobile.mp4" type="video/mp4">
                <img src="poster.jpg?q=80&w=2070&auto=format&fit=crop" alt="Mobile Fallback">
            </video>

            <!-- TOP TEXT -->
            <div class="splash-content">
                <h1>Welcome</h1>
                <p>Unleash Your Potential</p>
            </div>

            <!-- ABSOLUTE BOTTOM BUTTON -->
            <div class="cta-wrapper">
                <a href="home.html" class="cta-btn">
                    <i class="fas fa-bolt"></i> Get Tough
                </a>
            </div>
        </div>
    </div>
</body>
</html>
