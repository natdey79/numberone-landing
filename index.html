<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Number One</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        .landing-shell {
            position: relative;
            width: 100%;
            min-height: 100vh;
        }

        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
            background: #000;
        }

        .splash-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: 100%;
            height: 100%;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.65) contrast(1.1);
            display: block;
        }

        /* --- TOP IMAGE --- */
        .splash-content {
            position: relative;
            z-index: 3;
            padding-top: 20px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards 0.5s;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .splash-logo-title {
            max-width: 80%;
            width: 600px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.15));
            animation: 
                logoFloat 3s ease-in-out infinite,
                logoPulse 3s ease-in-out infinite;
            transition: filter 0.3s ease;
        }

        /* Desktop image - default */
        .splash-logo-title.desktop-logo {
            display: block;
        }
        .splash-logo-title.mobile-logo {
            display: none;
        }

        /* --- ANIMATION 1: FLOATING UP & DOWN - MORE MOVEMENT FOR DESKTOP --- */
        @keyframes logoFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-40px); }  /* INCREASED from -20px to -40px */
            100% { transform: translateY(0px); }
        }

        /* --- ANIMATION 2: PULSING GLOW --- */
        @keyframes logoPulse {
            0% { filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.15)) drop-shadow(0 0 20px rgba(255, 215, 0, 0.05)); }
            50% { filter: drop-shadow(0 0 70px rgba(255, 215, 0, 0.4)) drop-shadow(0 0 120px rgba(255, 215, 0, 0.2)); }
            100% { filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.15)) drop-shadow(0 0 20px rgba(255, 215, 0, 0.05)); }
        }

        .splash-logo-title:hover {
            filter: drop-shadow(0 0 80px rgba(255, 215, 0, 0.5)) drop-shadow(0 0 150px rgba(255, 215, 0, 0.25));
            transform: scale(1.04);
            transition: all 0.4s ease;
        }

        /* --- BUTTON (Locked at Bottom) --- */
        .cta-wrapper {
            position: absolute;
            bottom: 100px;
            left: 0;
            right: 0;
            z-index: 3;
            display: flex;
            justify-content: center;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards 1s;
        }

        @media (max-width: 768px) {
            .cta-wrapper {
                bottom: 80px !important;
            }
        }

        .cta-btn {
            display: inline-block;
            padding: 24px 60px;
            background-color: #dc143c;
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            border: 3px solid #dc143c;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: pulseSway 2.5s infinite ease-in-out;
            box-shadow: 0 0 30px rgba(220, 20, 60, 0.4);
        }

        .cta-btn:hover {
            background-color: transparent;
            color: #dc143c;
            animation-play-state: paused;
            box-shadow: 0 0 50px rgba(220, 20, 60, 0.6);
        }

        .cta-btn i {
            margin-right: 12px;
            font-size: 28px;
        }

        @keyframes pulseSway {
            0% { transform: translateX(0px) scale(1); box-shadow: 0 0 30px rgba(220, 20, 60, 0.4); }
            25% { transform: translateX(-6px) scale(1.03); box-shadow: 0 0 50px rgba(220, 20, 60, 0.7); }
            50% { transform: translateX(6px) scale(1); box-shadow: 0 0 30px rgba(220, 20, 60, 0.4); }
            75% { transform: translateX(-6px) scale(1.03); box-shadow: 0 0 50px rgba(220, 20, 60, 0.7); }
            100% { transform: translateX(0px) scale(1); box-shadow: 0 0 30px rgba(220, 20, 60, 0.4); }
        }

        /* --- DESKTOP VIDEO --- */
        .splash-video.desktop-video { display: block; }
        .splash-video.mobile-video { display: none; }

        /* --- MOBILE VIDEO & SCALING --- */
        @media (max-width: 768px) {
            .splash-content {
                padding-top: 40px;
            }
            
            /* Switch to mobile logo */
            .splash-logo-title.desktop-logo {
                display: none;
            }
            .splash-logo-title.mobile-logo {
                display: block;
                max-width: 85%;
                width: 300px;
            }
            
            /* Mobile gets less float movement */
            @keyframes logoFloat {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-15px); }  /* Less movement on mobile */
                100% { transform: translateY(0px); }
            }
            
            .cta-btn {
                padding: 18px 40px;
                font-size: 20px;
                letter-spacing: 2px;
                border-width: 2px;
                animation-duration: 2s;
            }
            .cta-btn i {
                font-size: 22px;
            }

            /* Switch videos */
            .splash-video.desktop-video { display: none; }
            .splash-video.mobile-video { display: block; }
        }

        /* --- SMALL PHONES --- */
        @media (max-width: 480px) {
            .splash-logo-title.mobile-logo {
                max-width: 90%;
                width: 220px;
            }
            @keyframes logoFloat {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-10px); }  /* Even less on small phones */
                100% { transform: translateY(0px); }
            }
            .cta-btn {
                padding: 14px 30px;
                font-size: 17px;
            }
            .cta-btn i {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="landing-shell">
        <div class="splash-container">
            
            <!-- DESKTOP VIDEO -->
            <video autoplay muted loop playsinline class="splash-video desktop-video">
                <source src="intro-index.mp4" type="video/mp4">
                <img src="poster.jpg?q=80&w=2070&auto=format&fit=crop" alt="Desktop Fallback">
            </video>

            <!-- MOBILE VIDEO -->
            <video autoplay muted loop playsinline class="splash-video mobile-video">
                <source src="intro-index.mp4" type="video/mp4">
                <img src="poster.jpg?q=80&w=2070&auto=format&fit=crop" alt="Mobile Fallback">
            </video>

            <!-- TOP IMAGES - Desktop & Mobile versions with animations -->
            <div class="splash-content">
                <!-- Desktop Image - moves up more -->
                <img src="unleash-desktop.png" alt="" class="splash-logo-title desktop-logo">
                <!-- Mobile Image - moves up less -->
                <img src="unleash.png" alt="" class="splash-logo-title mobile-logo">
            </div>

            <!-- ABSOLUTE BOTTOM BUTTON -->
            <div class="cta-wrapper">
                <a href="home.html" class="cta-btn">
                    <i class="fas fa-bolt"></i> Get Tough
                </a>
            </div>
        </div>
    </div>
</body>
</html>
