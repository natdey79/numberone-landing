<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Number One</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- RESET & BASICS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow: hidden; /* Prevents scrolling on the welcome page */
        }

        /* --- WELCOME HERO SECTION --- */
        .welcome-container {
            position: relative;
            width: 100%;
            height: 100vh; /* Full screen height */
            
            /* REPLACE THIS URL WITH YOUR OWN IMAGE FILE, e.g., url('welcome-bg.png') */
            background-image: url('promo-1.jpg?q=80&w=2070&auto=format&fit=crop');
            
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Dark overlay to make text pop */
        .welcome-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4); /* 40% darkness overlay */
            z-index: 1;
        }

        .welcome-content {
            position: relative;
            z-index: 2;
            padding: 20px;
            max-width: 800px;
        }

        .welcome-content h1 {
            font-size: 64px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
            letter-spacing: 2px;
        }

        .welcome-content p {
            font-size: 22px;
            color: #fff;
            margin-bottom: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        /* --- THE SHOP BUTTON --- */
        .shop-btn {
            display: inline-block;
            padding: 18px 50px;
            background-color: #25D366; /* WhatsApp Green - feels trustworthy */
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.3s ease;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
        }

        .shop-btn:hover {
            background-color: #20bd5a;
            transform: translateY(-3px); /* Slight lift effect */
            box-shadow: 0 15px 30px rgba(37, 211, 102, 0.5);
        }

        .shop-btn i {
            margin-right: 10px;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 768px) {
            .welcome-content h1 {
                font-size: 36px;
            }
            .welcome-content p {
                font-size: 18px;
            }
            .shop-btn {
                padding: 16px 35px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <div class="welcome-content">
            <h1>ナンバーワン</h1>
            <p>Number One / Otoko Ichiban<br>Empower your confidence today.</p>
            
            <!-- TRANSFERS TO PRODUCT PAGE WHEN CLICKED -->
            <a href="index.html" class="shop-btn">
                <i class="fas fa-shopping-bag"></i> Get Tough Now
            </a>
        </div>
    </div>

</body>
</html>
